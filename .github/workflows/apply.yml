# Applies the platform layer after a merge to main, with the tf-platform identity and a required reviewer
# on the platform environment. The plan output stays out of the public log.
name: Apply

on:
  push:
    branches: [main]
    paths: ["platform/**", "scripts/tf-*.sh", "scripts/plan_summary.py"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: apply-platform
  cancel-in-progress: false

jobs:
  apply:
    name: Apply platform
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: platform
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_STATE_RG: ${{ vars.TF_STATE_RG }}
      TF_STATE_SA: ${{ vars.TF_STATE_SA }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false
      - name: Init
        run: bash scripts/tf-layer.sh init platform
      - name: Plan
        run: |
          bash scripts/tf-layer.sh apply-plan platform
          bash scripts/tf-layer.sh summary platform >> "$GITHUB_STEP_SUMMARY" || echo "::warning::plan summary unavailable"
      - name: Apply
        run: bash scripts/tf-layer.sh apply platform
      - name: Verify idempotency
        run: |
          rc=0
          bash scripts/tf-layer.sh verify platform || rc=$?
          case "$rc" in
            0) echo "Second plan: no changes" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            2) echo "::error::second plan still has changes"; exit 1 ;;
            *) echo "::error::second plan failed"; exit 1 ;;
          esac
