# Weekly proof of what the pipeline identities may not do. Every check is a refusal, plus one control that must work.
name: Rights test

on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan-identity:
    name: tf-plan
    runs-on: ubuntu-24.04
    environment: plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: bash scripts/rights-test.sh plan | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          TF_STATE_SA: ${{ vars.TF_STATE_SA }}

  staging-identity:
    name: tf-staging
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: bash scripts/rights-test.sh staging | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          TF_STATE_SA: ${{ vars.TF_STATE_SA }}
          PIPELINE_PRINCIPAL_IDS: ${{ vars.PIPELINE_PRINCIPAL_IDS }}
          RIGHTS_TEST_USER_ID: ${{ vars.RIGHTS_TEST_USER_ID }}
