# Checks every pull request. Only the Plan job signs in to Azure, with the tf-plan identity (read-only on Azure resources and state; plans are lock-free).
# The plan is posted as a summary of resource types and counts; full plans are never published.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16"
      - run: terraform fmt -check -recursive
      - name: Validate every root and test the module
        run: |
          for d in platform environments/staging; do
            terraform -chdir="$d" init -backend=false -input=false > /dev/null
            terraform -chdir="$d" validate
          done
          terraform -chdir=modules/workload init -backend=false -input=false > /dev/null
          terraform -chdir=modules/workload test
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          for d in platform environments/staging modules/workload; do
            tflint --chdir="$d" --config="$GITHUB_WORKSPACE/.tflint.hcl" --format compact
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.20
      - run: checkov -d platform -d modules -d environments --framework terraform --quiet --compact

  scripts:
    name: Script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: for t in tests/*.test.sh; do bash "$t"; done

  leak:
    name: Leak check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/leak-check.sh
        env:
          LEAK_BLOCKLIST: ${{ secrets.LEAK_BLOCKLIST }}

  plan:
    name: Plan (${{ matrix.layer }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: plan
    strategy:
      fail-fast: false
      matrix:
        layer: [platform]
    permissions:
      contents: read
      id-token: write       # OIDC token, no secret involved
      pull-requests: write  # the plan summary comment
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_STATE_RG: ${{ vars.TF_STATE_RG }}
      TF_STATE_SA: ${{ vars.TF_STATE_SA }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
      TF_VAR_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false
      - name: Init
        run: bash scripts/tf-layer.sh init "${{ matrix.layer }}"
      - name: Plan
        run: |
          rc=0
          bash scripts/tf-layer.sh plan "${{ matrix.layer }}" || rc=$?
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
          bash scripts/tf-layer.sh summary "${{ matrix.layer }}" > summary.md || echo "Plan summary unavailable." > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          LAYER: ${{ matrix.layer }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker="<!-- plan-summary-${LAYER} -->"
          body=$(printf '%s\n### Terraform plan (%s)\n\n%s\n' "$marker" "$LAYER" "$(cat summary.md)")
          # Capture first, then cut: `| head -n1` could end the pipe early and fail the step under pipefail.
          ids=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" --jq ".[] | select(.body | startswith(\"${marker}\")) | .id")
          id=${ids%%$'\n'*}
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" -R "$REPO" --body "$body"
          fi
