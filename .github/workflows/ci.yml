# Checks every pull request. Only the Plan job signs in to Azure, with the tf-plan identity (read-only on Azure resources and state; plans are lock-free).
# The plan is posted as a summary of resource types and counts; full plans are never published.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16"
      - run: terraform fmt -check -recursive
      - name: Validate every root and test the module
        run: |
          for d in platform environments/staging; do
            terraform -chdir="$d" init -backend=false -input=false > /dev/null
            terraform -chdir="$d" validate
          done
          terraform -chdir=modules/workload init -backend=false -input=false > /dev/null
          terraform -chdir=modules/workload test
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          for d in platform environments/staging modules/workload; do
            tflint --chdir="$d" --config="$GITHUB_WORKSPACE/.tflint.hcl" --format compact
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.20
      - run: checkov -d platform -d modules -d environments --framework terraform --quiet --compact

  scripts:
    name: Script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: for t in tests/*.test.sh; do bash "$t"; done

  leak:
    name: Leak check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/leak-check.sh
        env:
          LEAK_BLOCKLIST: ${{ secrets.LEAK_BLOCKLIST }}

  plan:
    name: Plan (${{ matrix.layer }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    environment: plan
    strategy:
      fail-fast: false
      matrix:
        layer: [platform, staging]
    permissions:
      contents: read
      id-token: write       # OIDC token, no secret involved
      pull-requests: write  # the plan summary comment
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_STATE_RG: ${{ vars.TF_STATE_RG }}
      TF_STATE_SA: ${{ vars.TF_STATE_SA }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
      TF_VAR_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependabot gate
        id: gate
        env:
          LAYER: ${{ matrix.layer }}
          ACTOR: ${{ github.actor }}
        run: |
          # The staging leg loads the private configuration, so it does not run for Dependabot pull requests (ADR 5).
          if [[ "$LAYER" == staging && "$ACTOR" == "dependabot[bot]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Staging plan skipped for a Dependabot pull request (it would run the bumped dependency with the private configuration). Run it after merge or on a maintainer branch." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Private configuration
        if: matrix.layer != 'platform' && steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 314159DD/swiftjob-platform-config
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}
          path: config
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: matrix.layer != 'platform' && steps.gate.outputs.skip != 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: State check
        id: state
        if: matrix.layer != 'platform' && steps.gate.outputs.skip != 'true'
        env:
          LAYER: ${{ matrix.layer }}
        run: |
          # Exit 0: state exists. 3: no state and an empty resource group (first apply pending). Anything else fails the job.
          rc=0
          bash scripts/state-check.sh "$LAYER" || rc=$?
          case "$rc" in
            0) ;;
            3)
              echo "${LAYER} state not created yet and its resource group is empty: first apply pending, nothing to plan." >> "$GITHUB_STEP_SUMMARY"
              echo "missing=true" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.gate.outputs.skip != 'true'
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false
      - name: Init
        if: steps.gate.outputs.skip != 'true' && steps.state.outputs.missing != 'true'
        run: bash scripts/tf-layer.sh init "${{ matrix.layer }}"
      - name: Plan
        if: steps.gate.outputs.skip != 'true' && steps.state.outputs.missing != 'true'
        run: |
          rc=0
          bash scripts/tf-layer.sh plan "${{ matrix.layer }}" || rc=$?
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
          bash scripts/tf-layer.sh summary "${{ matrix.layer }}" > summary.md || echo "Plan summary unavailable." > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment
        if: steps.gate.outputs.skip != 'true' && steps.state.outputs.missing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LAYER: ${{ matrix.layer }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker="<!-- plan-summary-${LAYER} -->"
          body=$(printf '%s\n### Terraform plan (%s)\n\n%s\n' "$marker" "$LAYER" "$(cat summary.md)")
          # Capture first, then cut: `| head -n1` could end the pipe early and fail the step under pipefail.
          ids=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" --jq ".[] | select(.body | startswith(\"${marker}\")) | .id")
          id=${ids%%$'\n'*}
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" -R "$REPO" --body "$body"
          fi
