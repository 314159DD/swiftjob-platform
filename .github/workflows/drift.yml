# Nightly: does Azure still match the code? Uses the tf-plan identity (read-only on Azure resources and state; plans are lock-free). A red run e-mails the owner.
name: Drift

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  guard:
    name: RBAC guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: plan
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_STATE_RG: ${{ vars.TF_STATE_RG }}
      TF_STATE_SA: ${{ vars.TF_STATE_SA }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: RBAC guard
        env:
          PIPELINE_PRINCIPAL_IDS: ${{ vars.PIPELINE_PRINCIPAL_IDS }}
        run: |
          read -r -a ids <<< "${PIPELINE_PRINCIPAL_IDS:-}"
          # 4 ids before the production identity exists (plan 05 bootstrap), 5 after it.
          if [[ ${#ids[@]} -ne 4 && ${#ids[@]} -ne 5 ]]; then echo "::error::PIPELINE_PRINCIPAL_IDS not set or not 4 or 5 ids"; exit 1; fi
          # Azure makes the creator of a management group its Owner. Terraform does not track that, so check it here.
          mgs=$(az rest --method get --url "https://management.azure.com/providers/Microsoft.Management/managementGroups/mg-swiftjob?api-version=2021-04-01&\$expand=children&\$recurse=true" -o json |
            jq -r '.. | objects | select(.type? == "Microsoft.Management/managementGroups") | .name' | tr -d '\r' | sort -u)
          if ! grep -qx mg-swiftjob <<< "$mgs"; then echo "::error::mg-swiftjob missing from management group list"; exit 1; fi
          {
            for mg in $mgs; do
              az role assignment list --scope "/providers/Microsoft.Management/managementGroups/${mg}" -o json
            done
            az role assignment list --all -o json
          } | jq -s 'add' | bash scripts/rbac-guard.sh "${ids[@]}"

  drift:
    name: Drift (${{ matrix.layer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: plan
    strategy:
      fail-fast: false
      matrix:
        layer: [platform, staging]
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_STATE_RG: ${{ vars.TF_STATE_RG }}
      TF_STATE_SA: ${{ vars.TF_STATE_SA }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
      TF_VAR_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Private configuration
        if: matrix.layer != 'platform'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 314159DD/swiftjob-platform-config
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}
          path: config
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: matrix.layer != 'platform'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: State check
        id: state
        if: matrix.layer != 'platform'
        env:
          LAYER: ${{ matrix.layer }}
        run: |
          # Exit 0: state exists. 3: no state and an empty resource group (first apply pending). Anything else fails the job.
          rc=0
          bash scripts/state-check.sh "$LAYER" || rc=$?
          case "$rc" in
            0) ;;
            3)
              echo "${LAYER} state not created yet and its resource group is empty: first apply pending, nothing to plan." >> "$GITHUB_STEP_SUMMARY"
              echo "missing=true" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false
      - name: Init
        if: steps.state.outputs.missing != 'true'
        run: bash scripts/tf-layer.sh init "${{ matrix.layer }}"
      - name: Plan
        if: steps.state.outputs.missing != 'true'
        run: |
          rc=0
          bash scripts/tf-layer.sh plan "${{ matrix.layer }}" || rc=$?
          if [[ -f "${{ matrix.layer == 'platform' && 'platform' || format('environments/{0}', matrix.layer) }}/tfplan" ]]; then
            # A failing summary must not hide the drift result below it.
            bash scripts/tf-layer.sh summary "${{ matrix.layer }}" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::plan summary unavailable"
          fi
          bash scripts/drift-exit.sh "$rc" | tee -a "$GITHUB_STEP_SUMMARY"
