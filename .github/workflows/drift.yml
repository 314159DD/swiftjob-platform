# Nightly: does Azure still match the code? Uses the tf-plan identity (read-only on Azure resources; writes only the state lock). A red run e-mails the owner.
name: Drift

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: apply-platform
  cancel-in-progress: false

jobs:
  drift:
    name: Drift platform
    runs-on: ubuntu-24.04
    environment: plan
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: RBAC guard
        env:
          PIPELINE_PRINCIPAL_IDS: ${{ vars.PIPELINE_PRINCIPAL_IDS }}
        run: |
          read -r -a ids <<< "${PIPELINE_PRINCIPAL_IDS:-}"
          if [[ ${#ids[@]} -ne 3 ]]; then echo "::error::PIPELINE_PRINCIPAL_IDS not set or not exactly 3 ids"; exit 1; fi
          # Azure makes the creator of a management group its Owner. Terraform does not track that, so check it here.
          mgs=$(az account management-group show --name mg-swiftjob --expand --recurse -o json |
            jq -r '.. | objects | select(.type? == "Microsoft.Management/managementGroups") | .name' | tr -d '\r' | sort -u)
          if ! grep -qx mg-swiftjob <<< "$mgs"; then echo "::error::mg-swiftjob missing from management group list"; exit 1; fi
          {
            for mg in $mgs; do
              az role assignment list --scope "/providers/Microsoft.Management/managementGroups/${mg}" -o json
            done
            az role assignment list --all -o json
          } | jq -s 'add' | bash scripts/rbac-guard.sh "${ids[@]}"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false
      - run: >
          terraform -chdir=platform init
          -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_SA }}"
      - name: Plan
        run: |
          rc=0
          terraform -chdir=platform plan -input=false -lock-timeout=5m -detailed-exitcode -out=tfplan > /dev/null || rc=$?
          if [[ -f platform/tfplan ]]; then
            terraform -chdir=platform show -json tfplan | python3 scripts/plan_summary.py >> "$GITHUB_STEP_SUMMARY"
          fi
          bash scripts/drift-exit.sh "$rc" | tee -a "$GITHUB_STEP_SUMMARY"
